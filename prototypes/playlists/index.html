<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XSTAR · 歌单界面研究 / 10 个方向</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e7df;color:#252620;font:14px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}header{max-width:1320px;margin:auto;padding:55px 36px 35px}.label{font:10px Consolas,monospace;letter-spacing:2px;color:#676b5f}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:25px;margin-top:22px}h1{font-size:clamp(34px,5vw,64px);font-weight:500;line-height:1.2;letter-spacing:-3px;margin:0}header p{font-size:12px;color:#6b6d64;max-width:330px;line-height:1.9;margin:0}.toolbar{display:flex;align-items:center;gap:9px;margin-top:32px;flex-wrap:wrap}.toolbar>span{font-size:11px;margin-right:8px}.toolbar button{border:1px solid #25262030;background:none;border-radius:30px;padding:8px 14px;color:#333;font:11px inherit;cursor:pointer}.toolbar button.active{background:#252620;color:#fff}.toolbar input{width:28px;height:28px;border:0;padding:0;background:none}.grid{max-width:1320px;margin:auto;padding:0 36px 55px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:35px 20px}.study{min-width:0}.preview{height:365px;overflow:hidden;border-radius:15px;background:#111214;position:relative;border:1px solid #0002;transition:transform .25s,box-shadow .25s}.study:hover .preview{transform:translateY(-5px);box-shadow:0 14px 28px #0002}.preview iframe{width:390px;height:720px;border:0;transform:scale(var(--scale,.55));transform-origin:top left;pointer-events:none}.preview:after{content:'打开原型 ↗';position:absolute;bottom:0;left:0;right:0;background:#171916e8;color:#efefe8;font-size:10px;text-align:center;padding:10px;backdrop-filter:blur(8px)}.meta{display:flex;gap:11px;margin-top:14px;align-items:baseline}.meta span{font:10px Consolas;color:#7d8072}.meta h2{font-size:16px;font-weight:550;letter-spacing:-.5px;margin:0}.study p{font-size:11px;color:#75786d;margin:5px 0 0 26px}footer{max-width:1248px;margin:0 auto 30px;border-top:1px solid #0002;padding-top:18px;font-size:11px;color:#77796e;display:flex;justify-content:space-between;gap:20px}@media(max-width:1150px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.heading{display:block}header p{margin-top:18px}}@media(max-width:620px){header{padding:30px 20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:0 20px 30px;gap:25px 13px}.preview{height:320px}.meta{gap:7px}.meta h2{font-size:14px}.study p{margin-left:21px;font-size:10px}footer{margin:0 20px 25px;flex-direction:column}}@media(prefers-reduced-motion:reduce){.preview{transition:none}}
</style></head><body><header><div class="label">XSTAR / INTERFACE STUDIES / VOL. 01 &nbsp; <a href="bold.html" style="border-bottom:1px solid">第二组：大胆一点 11—20 ↗</a></div><div class="heading"><h1>把喜欢的声音，<br>放在一起。</h1><p>10 个移动端歌单方向。<br>同一份音乐，不同的收纳方式。<br>点击任意方案，体验歌单、详情和播放队列。</p></div><div class="toolbar"><span>预览主题</span><button data-color="#78a9ff" class="active">蓝</button><button data-color="#ae8cff">紫</button><button data-color="#ff7998">玫瑰</button><button data-color="#55d6a9">翡翠</button><button data-color="#ffbe5c">琥珀</button><input type="color" value="#78a9ff" aria-label="自定义主题色"><button id="light">切换日间</button></div></header><main class="grid" id="grid"></main><footer><span>内嵌封面 · 离线可用 · 自适应移动端 · 主题同步</span><span>交互演示 / 不播放真实音频 / 歌单编辑刷新后重置</span></footer><script>
const entries=[['01-record-shelf','唱片架','封套 / 双列 / 黑胶'],['02-editorial-index','编辑目录','衬线 / 编号 / 信息秩序'],['03-gravity-orbit','引力轨道','圆盘 / 错位 / 轻引力'],['04-contact-sheet','接触印样','拼版 / 底片 / 视觉收藏'],['05-fluid-cuts','流动切片','弧形 / 交错 / 单手操作'],['06-private-setlist','演出曲目单','票根 / 虚线 / 现场感'],['07-pocket-tapes','口袋磁带','混音带 / 触感 / 私人录制'],['08-sound-routes','声音线路','站点 / 路线 / 连续性'],['09-listening-notes','留白手记','照片 / 手记 / 慢节奏'],['10-signal-panel','信号面板','音频设备 / 细线 / 高密度']];
const grid=document.getElementById('grid');grid.innerHTML=entries.map(([file,name,desc],i)=>`<a class="study" href="${file}.html"><div class="preview"><iframe title="${name}移动端预览" src="${file}.html" tabindex="-1" loading="lazy"></iframe></div><div class="meta"><span>${String(i+1).padStart(2,'0')}</span><h2>${name}</h2></div><p>${desc}</p></a>`).join('');
let theme={accent:'#78a9ff',light:false,scene:'Classic'};try{Object.assign(theme,JSON.parse(localStorage.getItem('xstar-playlist-theme')||'{}'))}catch{}
function sync(){try{localStorage.setItem('xstar-playlist-theme',JSON.stringify(theme))}catch{}document.querySelectorAll('iframe').forEach(frame=>{const root=frame.contentDocument?.documentElement;if(root){root.style.setProperty('--accent',theme.accent);root.dataset.light=theme.light;root.dataset.scene=theme.scene;const c=theme.accent.slice(1);const v=[0,2,4].map(i=>parseInt(c.slice(i,i+2),16));root.style.setProperty('--on-accent',v[0]*.299+v[1]*.587+v[2]*.114>150?'#111214':'#ffffff')}});document.getElementById('light').textContent=theme.light?'切换夜间':'切换日间';document.querySelectorAll('[data-color]').forEach(b=>b.classList.toggle('active',b.dataset.color===theme.accent))}
document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{theme.accent=b.dataset.color;sync()});document.querySelector('input[type=color]').oninput=e=>{theme.accent=e.target.value;sync()};document.getElementById('light').onclick=()=>{theme.light=!theme.light;sync()};document.querySelectorAll('iframe').forEach(f=>f.onload=sync);const observer=new ResizeObserver(()=>document.querySelectorAll('.preview').forEach(p=>p.style.setProperty('--scale',p.clientWidth/390)));observer.observe(grid);sync();
</script></body></html>
