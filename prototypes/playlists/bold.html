<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XSTAR · 大胆一点 / 歌单原型 11—20</title><style>
*{box-sizing:border-box}body{margin:0;background:#dfed46;color:#171915;font:14px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}header{max-width:1400px;padding:40px 40px 28px;margin:auto}.topline{display:flex;justify-content:space-between;font:10px Consolas,monospace;letter-spacing:1px}.topline a{border-bottom:1px solid}.hero{display:flex;justify-content:space-between;align-items:flex-end;padding:30px 0 25px;border-bottom:2px solid #171915}.hero h1{font-size:clamp(50px,8vw,105px);letter-spacing:-6px;font-weight:900;line-height:.95;margin:0}.hero h1 span{-webkit-text-stroke:1px #171915;color:transparent}.hero p{font-size:12px;line-height:1.9;margin:0;max-width:290px}.tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding-top:21px}.tools span{font:10px Consolas;margin-right:5px}.tools button{border:1px solid #17191555;border-radius:0;background:transparent;padding:8px 13px;cursor:pointer;font-size:11px;color:inherit}.tools button.active{background:#171915;color:#dfed46}.tools input{width:29px;height:29px;border:0;background:transparent;padding:0}.grid{max-width:1400px;margin:auto;padding:0 40px 45px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:30px 20px}.study{min-width:0}.preview{position:relative;background:#111214;height:440px;overflow:hidden;border-radius:4px;border:1px solid #171915;transition:transform .2s,box-shadow .2s}.study:hover .preview{transform:rotate(-1deg) translateY(-5px);box-shadow:7px 7px 0 #171915}.preview iframe{border:0;width:390px;height:850px;transform:scale(var(--scale,.58));transform-origin:top left;pointer-events:none}.preview:after{content:'进入原型 ↗';position:absolute;bottom:0;left:0;right:0;padding:11px;text-align:center;background:#171915ef;color:#dfed46;font-size:10px;backdrop-filter:blur(8px)}.caption{display:flex;gap:9px;align-items:baseline;padding-top:12px}.caption span{font:10px Consolas}.caption h2{font-size:17px;font-weight:750;letter-spacing:-.5px;margin:0}.study p{font-size:10px;line-height:1.8;margin:5px 0 0 24px;opacity:.65}footer{max-width:1320px;margin:0 auto 30px;border-top:1px solid #171915;padding-top:20px;display:flex;justify-content:space-between;font-size:10px;gap:20px}.scene{margin-left:auto!important}@media(max-width:1150px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{display:block}.hero p{margin-top:25px}.scene{margin-left:0!important}}@media(max-width:620px){header{padding:26px 20px}.topline{font-size:8px}.hero h1{font-size:64px;letter-spacing:-4px}.grid{padding:0 20px 30px;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px 13px}.preview{height:375px}.caption{gap:6px}.caption h2{font-size:14px}.study p{margin-left:21px;font-size:9px}footer{margin:0 20px 25px;flex-direction:column}.tools{gap:7px}.tools button{padding:7px 9px}}@media(prefers-reduced-motion:reduce){.preview{transition:none}}
</style></head><body><header><div class="topline"><span>XSTAR / PLAYLIST STUDIES / VOL. 02</span><a href="index.html">第一组 01—10 ↗</a></div><div class="hero"><h1>大胆一点。<br><span>再听一面。</span></h1><p>十个更不守规矩的歌单界面。<br>转唱盘、开窗口、投币、抽一本声音。<br>每版都可以编辑歌单、切换主题与管理队列。</p></div><div class="tools"><span>THEME</span><button data-color="#78a9ff" class="active">蓝</button><button data-color="#ae8cff">紫</button><button data-color="#ff7998">玫瑰</button><button data-color="#55d6a9">翡翠</button><button data-color="#ffbe5c">琥珀</button><input type="color" value="#78a9ff" aria-label="自定义主题色"><button id="light">切换日间</button><button class="scene" id="scene">外观：经典</button></div></header><main class="grid" id="grid"></main><footer><span>11—20 / 十种布局，十种找音乐的方式</span><span>离线 HTML · 移动端交互 · 模拟播放 · 歌单刷新后重置</span></footer><script>
const entries=[['11-off-center-records','离心唱盘','转一张唱片，再放下唱针'],['12-sound-departures','声音登机口','拿好登机牌，目的地是凌晨'],['13-comic-room','漫画放映室','粗框、分镜，生活自带音效'],['14-desktop-escape','桌面逃逸','切换窗口，给耳朵开个小差'],['15-soft-club','软体俱乐部','软雕塑，按下就换种心情'],['16-heavy-type','重型字场','让歌单名，成为整张海报'],['17-mood-vending','情绪售货机','投一枚心情，随机取货'],['18-cinema-strip','胶片长镜头','横滑选片，给日常加原声'],['19-folded-spines','折叠书脊','滑过书架，抽一本声音'],['20-sonar-frequency','声呐寻频','扫描歌单，锁定喜欢的信号']];
document.getElementById('grid').innerHTML=entries.map(([f,n,d],i)=>`<a class="study" href="${f}.html"><div class="preview"><iframe title="${n}移动端原型" src="${f}.html" tabindex="-1" loading="lazy"></iframe></div><div class="caption"><span>${i+11}</span><h2>${n}</h2></div><p>${d}</p></a>`).join('');
let theme={accent:'#78a9ff',light:false,scene:'Classic'};try{Object.assign(theme,JSON.parse(localStorage.getItem('xstar-playlist-theme')||'{}'))}catch{}
const scenes=['Classic','Orbital','Theatre','Liquid','Tape'],sceneNames=['经典','星际漫游','歌词剧场','液态光碟','口袋磁带'];
function sync(){try{localStorage.setItem('xstar-playlist-theme',JSON.stringify(theme))}catch{}document.querySelectorAll('iframe').forEach(f=>{const r=f.contentDocument?.documentElement;if(!r)return;r.style.setProperty('--accent',theme.accent);r.dataset.light=theme.light;r.dataset.scene=theme.scene;const c=theme.accent.slice(1),v=[0,2,4].map(i=>parseInt(c.slice(i,i+2),16));r.style.setProperty('--on-accent',v[0]*.299+v[1]*.587+v[2]*.114>150?'#111214':'#ffffff')});document.querySelectorAll('[data-color]').forEach(b=>b.classList.toggle('active',b.dataset.color===theme.accent));document.getElementById('light').textContent=theme.light?'切换夜间':'切换日间';document.getElementById('scene').textContent='外观：'+sceneNames[scenes.indexOf(theme.scene)]}
document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{theme.accent=b.dataset.color;sync()});document.querySelector('input[type=color]').oninput=e=>{theme.accent=e.target.value;sync()};document.getElementById('light').onclick=()=>{theme.light=!theme.light;sync()};document.getElementById('scene').onclick=()=>{theme.scene=scenes[(scenes.indexOf(theme.scene)+1)%5];sync()};document.querySelectorAll('iframe').forEach(f=>f.onload=sync);new ResizeObserver(()=>document.querySelectorAll('.preview').forEach(p=>p.style.setProperty('--scale',p.clientWidth/390))).observe(document.getElementById('grid'));sync();
</script></body></html>
