<style>

.nebula{overflow:visible;opacity:.72;animation:nebulaDrift 34s ease-in-out infinite alternate}.nebula:before,.nebula:after{content:"";position:absolute;inset:-16% -8%;pointer-events:none;border-radius:50%;filter:blur(28px);mix-blend-mode:screen}.nebula:before{background:radial-gradient(ellipse at 18% 48%,#7660c51c 0 8%,transparent 32%),radial-gradient(ellipse at 57% 35%,#5bd8cf15 0 7%,transparent 30%),radial-gradient(ellipse at 78% 72%,#a77bca14 0 8%,transparent 34%);transform:rotate(18deg) scale(1.12);animation:cloudPulse 19s ease-in-out infinite alternate}.nebula:after{inset:4% -20%;background:repeating-linear-gradient(112deg,transparent 0 13%,#b5a0ff09 14% 15%,transparent 18% 28%),radial-gradient(ellipse at 42% 62%,#f1bb8710,transparent 39%);filter:blur(12px);opacity:.7;transform:rotate(-12deg) skewY(-8deg);animation:dustDrift 27s linear infinite alternate}
@keyframes nebulaDrift{0%{transform:rotate(-28deg) skewY(-10deg) translate3d(-2%,-1%,-80px) scale(1)}100%{transform:rotate(-24deg) skewY(-7deg) translate3d(3%,2%,-80px) scale(1.07)}}@keyframes cloudPulse{0%{opacity:.42;transform:rotate(18deg) scale(1.04)}100%{opacity:.85;transform:rotate(24deg) scale(1.16)}}@keyframes dustDrift{0%{background-position:0 0;opacity:.35}100%{background-position:70px -35px;opacity:.7}}
.album-panel{position:absolute;z-index:10;inset:auto 10px 14px;padding:17px 16px 15px;border:1px solid #ffffff24;border-radius:24px;background:linear-gradient(145deg,#1a1c30f2,#0c1220f0);backdrop-filter:blur(22px);box-shadow:0 20px 70px #000b;transform:translateY(120%);opacity:0;transition:.4s cubic-bezier(.2,.8,.2,1)}.album-panel.show{transform:translateY(0);opacity:1}.album-head{display:flex;gap:12px;align-items:center}.album-cover{width:68px;height:68px;border-radius:17px;background:var(--cover,linear-gradient(135deg,#b69cff,#16182e));background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px #fff4,0 0 25px #b69cff55}.album-copy{min-width:0;flex:1}.album-copy h2{font-size:17px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.album-copy p{font-size:11px;color:#9ba3bb;margin:3px 0}.close{border:0;background:#fff1;color:#c9c9d8;border-radius:50%;width:30px;height:30px}.album-actions{display:flex;gap:8px;margin:13px 0}.album-actions button{flex:1;border:0;border-radius:12px;padding:9px;background:#b69cff;color:#141026;font-size:12px;font-weight:600}.album-actions button.secondary{background:#ffffff0d;color:#cbd0e0;border:1px solid #ffffff17}.track-list{border-top:1px solid #fff1;padding-top:7px}.track-row{display:flex;align-items:center;gap:9px;padding:7px 0;color:#dfe1ed;font-size:12px}.track-row span:first-child{width:18px;color:#747e98;text-align:center}.track-row small{margin-left:auto;color:#7c879f}
*{box-sizing:border-box} :root{--bg:#050711;--ink:#f8f4ff;--muted:#9da1b9;--violet:#b69cff;--cyan:#69e9d8;--gold:#ffd19a;--glass:#111728b8}body{margin:0;min-height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif}.app{width:100%;max-width:430px;height:100vh;min-height:650px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(ellipse at 48% 48%,#34266c55 0,transparent 39%),radial-gradient(ellipse at 8% 82%,#007a7830 0,transparent 43%),#050711}.sky{position:absolute;inset:0;perspective:800px;touch-action:none;cursor:grab}.sky.dragging{cursor:grabbing}.starfield,.nebula,.galaxy{position:absolute;inset:0;pointer-events:none}.starfield i{position:absolute;width:var(--s);height:var(--s);left:var(--x);top:var(--y);border-radius:50%;background:#fff;opacity:var(--o);box-shadow:0 0 7px #fff}.nebula{inset:12% -34% 18%;background:conic-gradient(from 26deg at 48% 50%,transparent,#8c78ff13 12%,transparent 30%,#61e3d611 45%,transparent 62%,#f5b87612 79%,transparent);filter:blur(25px);transform:rotate(-28deg) skewY(-10deg) translateZ(-80px)}.galaxy{transform-style:preserve-3d;transition:transform .08s linear}.rim{position:absolute;left:50%;top:51%;width:390px;height:230px;transform:translate(-50%,-50%) rotateX(63deg) rotateZ(-18deg);border:1px solid #b9a3ff37;border-radius:50%;box-shadow:0 0 26px #9678ff28,0 0 80px #65e2d91a;transform-style:preserve-3d}.rim:before,.rim:after{content:"";position:absolute;inset:27px -28px;border:1px solid #64e6d633;border-radius:50%;transform:translateZ(18px) rotateZ(25deg)}.rim:after{inset:56px -45px;border-color:#ffca8c2b;transform:translateZ(-18px) rotateZ(-35deg)}.dust{position:absolute;left:50%;top:51%;width:420px;height:230px;transform:translate(-50%,-50%) rotateX(63deg) rotateZ(-18deg);border-radius:50%;background:radial-gradient(ellipse,#aa8dff1d 0 4%,transparent 45%),conic-gradient(from 30deg,transparent,#b993ff28,transparent 23%,#61e1d820,transparent 46%,#ffd0961c,transparent 69%);filter:blur(10px);opacity:.9}.core{position:absolute;left:50%;top:51%;width:64px;height:64px;transform:translate(-50%,-50%) translateZ(30px);border:1px solid #f1e9ffcc;border-radius:50%;background:radial-gradient(circle at 29% 23%,#fff 0 8%,#d2b9ff 17%,#54418c 43%,#0b1021 72%);box-shadow:0 0 14px #c7afff,0 0 55px #9a75ffcc,0 0 125px #6444dd88;display:grid;place-items:center;pointer-events:none}.core:after{content:'✦';font-size:18px;text-shadow:0 0 14px white}.planet{position:absolute;z-index:3;width:var(--size);height:var(--size);left:var(--x);top:var(--y);padding:0;border:0;border-radius:50%;background:transparent;transform:translate(-50%,-50%) translateZ(var(--z));transform-style:preserve-3d;cursor:pointer;color:white;filter:drop-shadow(0 0 var(--glow) var(--color));transition:filter .3s,transform .3s}.planet:before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--cover,radial-gradient(circle at 31% 24%,#fff,var(--color) 20%,#15152e 75%));background-size:cover;background-position:center;box-shadow:inset -12px -13px 18px #000b,inset 5px 4px 8px #fff8,0 0 8px var(--color)}.planet:after{content:"";position:absolute;inset:calc(var(--ring) * -1);border:1px solid var(--color);border-radius:50%;transform:rotate(-23deg) scaleX(1.45);opacity:.55;box-shadow:0 0 14px var(--color)}.planet .shine{position:absolute;z-index:2;inset:5%;border-radius:50%;background:radial-gradient(circle at 28% 18%,#fff9 0 7%,transparent 22%);mix-blend-mode:screen;pointer-events:none}.planet small{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;color:#e3e0ef;font-size:10px;text-shadow:0 2px 8px #000;opacity:.75}.planet:hover,.planet.selected{filter:drop-shadow(0 0 9px var(--color)) drop-shadow(0 0 29px var(--color));transform:translate(-50%,-50%) translateZ(calc(var(--z) + 20px)) scale(1.17)}.planet.dim{opacity:.6}.planet.cover-cyan{--color:var(--cyan)}.planet.cover-gold{--color:var(--gold)}.planet.cover-violet{--color:var(--violet)}.mode-orbit{position:absolute;z-index:5;top:21px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:5px;border:1px solid #ffffff24;border-radius:99px;background:#0b1020a8;backdrop-filter:blur(15px);box-shadow:0 9px 30px #0004}.mode-orbit button{position:relative;border:0;background:transparent;color:#737b96;font-size:11px;border-radius:99px;padding:7px 12px;transition:.25s}.mode-orbit button.active{color:#f0eaff;background:#a993ff24;box-shadow:0 0 18px #a993ff32}.mode-orbit button.active:before{content:"";position:absolute;inset:-5px;border:1px solid #b69cff55;border-radius:99px;animation:pulse 2.2s ease-in-out infinite}.hint{position:absolute;z-index:4;left:50%;bottom:93px;transform:translateX(-50%);white-space:nowrap;color:#9da5be;font-size:11px;padding:7px 12px;border:1px solid #fff1;border-radius:99px;background:#0d1220a8;backdrop-filter:blur(10px)}.info{position:absolute;z-index:8;left:12px;right:12px;bottom:17px;padding:14px 15px;border:1px solid #ffffff2b;border-radius:21px;background:linear-gradient(125deg,#202039ed,#101625e8);backdrop-filter:blur(21px);box-shadow:0 18px 50px #000b;transform:translateY(130%);opacity:0;transition:.38s cubic-bezier(.2,.8,.2,1)}.info.show{transform:translateY(0);opacity:1}.info-row{display:flex;align-items:center;gap:12px}.cover{width:51px;height:51px;border-radius:15px;background:radial-gradient(circle at 30% 20%,#fff,var(--color),#17172e);display:grid;place-items:center;font-size:20px;box-shadow:0 0 23px color-mix(in srgb,var(--color),transparent 45%)}.info h2{margin:0;font-size:16px}.info p{margin:2px 0 0;color:#9da5bb;font-size:11px}.play{margin-left:auto;width:42px;height:42px;border:0;border-radius:50%;background:var(--violet);color:#171126;font-size:16px;box-shadow:0 0 22px #a992ff99}.meta{display:flex;justify-content:space-between;border-top:1px solid #fff1;margin-top:11px;padding-top:9px;color:#afb5c8;font-size:11px}@keyframes pulse{50%{opacity:.35;transform:scale(1.08)}}@keyframes drift{50%{transform:translateY(-4px)}}@media(min-width:700px){.app{margin:20px auto;height:calc(100vh - 40px);min-height:650px;border:1px solid #ffffff10;border-radius:32px;box-shadow:0 30px 100px #0009}}
</style>
</head>
<body><main class="app">
<div class="mode-orbit"><button class="active" data-mode="all">银河</button><button data-mode="song">歌曲</button><button data-mode="album">专辑</button><button data-mode="hot">高频</button></div>
<section class="sky" id="sky"><div class="starfield" id="stars"></div><div class="nebula"></div><div class="galaxy" id="galaxy">
<button class="planet cover-violet" data-kind="song" data-title="Midnight City" data-artist="M83 · Hurry Up, We're Dreaming" data-time="播放 86 次 · 5 小时 42 分" data-icon="◒" style="--size:52px;--glow:10px;--ring:6px;--color:#b69cff;--x:19%;--y:43%;--z:40px;--cover:url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=180&q=80')"><i class="shine"></i><small>Midnight City</small></button>

<section class="album-panel" id="albumPanel"><div class="album-head"><div class="album-cover" id="albumCover"></div><div class="album-copy"><h2 id="albumTitle">Hurry Up, We're Dreaming</h2><p id="albumArtist">M83 · 专辑 · 2011</p><p id="albumMeta">22 首 · 播放 128 次</p></div><button class="close" id="closeAlbum">×</button></div><div class="album-actions"><button id="playAlbum">▶ 播放专辑</button><button class="secondary">＋ 加入队列</button></div><div class="track-list"><div class="track-row"><span>01</span><b>Intro</b><small>4:03</small></div><div class="track-row"><span>02</span><b>Midnight City</b><small>4:03</small></div><div class="track-row"><span>03</span><b>Wait</b><small>5:43</small></div></div></section>
</main>
<script>
const sky=document.querySelector('#sky'),galaxy=document.querySelector('#galaxy'),planets=[...document.querySelectorAll('.planet')],info=document.querySelector('#info');let dragging=false,lastX=0,velocity=0,rotation=0,raf;
const galaxyGeometry=planets.map((p,i)=>{const golden=Math.PI*(3-Math.sqrt(5));return{p,theta:Math.acos(1-2*(i+.7)/planets.length),phi:i*golden+(i%2)*.35}});
let yaw=-.45,pitch=.18;
function layoutGalaxy(){const w=sky.clientWidth,h=sky.clientHeight,cx=w/2,cy=h*.51,rx=Math.max(155,w*.57),ry=Math.max(245,h*.39);galaxyGeometry.forEach(g=>{const sx=Math.sin(g.theta)*Math.cos(g.phi),sy=Math.sin(g.theta)*Math.sin(g.phi),sz=Math.cos(g.theta);const cyaw=Math.cos(yaw),syaw=Math.sin(yaw),x1=sx*cyaw-sz*syaw,z1=sx*syaw+sz*cyaw;const cp=Math.cos(pitch),sp=Math.sin(pitch),y1=sy*cp-z1*sp,z2=sy*sp+z1*cp;const perspective=Math.max(.52,Math.min(1.34,1+z2*.45));const x=cx+x1*rx,y=cy+y1*ry;g.p.style.left=`${x}px`;g.p.style.top=`${y}px`;g.p.style.zIndex=String(Math.round(100+z2*100));g.p.style.opacity=String(.30+perspective*.55);g.p.style.setProperty('--scale',perspective.toFixed(3));g.p.style.transform=`translate(-50%,-50%) scale(${perspective.toFixed(3)})`;g.p.style.filter=`brightness(${(.58+perspective*.48).toFixed(2)}) drop-shadow(0 0 ${Math.round(4+perspective*9)}px ${getComputedStyle(g.p).getPropertyValue('--color')})`})}
const stars=document.querySelector('#stars');for(let i=0;i<150;i++){const s=document.createElement('i'),near=i<18,mid=i<70;s.className=near?'near':mid?'mid':'far';const scale=near?Math.random()*.75+.65:mid?Math.random()*.45+.4:Math.random()*.3+.25;s.style.cssText=`--x:${Math.random()*100}%;--y:${Math.random()*100}%;--s:${near?Math.random()*1.3+.7:mid?Math.random()*.8+.45:Math.random()*.45+.25}px;--z:${near?Math.random()*80:mid?-100+Math.random()*70:-300+Math.random()*100}px;--scale:${scale};--blur:${near?0:mid?.3:1.3}px;--low:${near?Math.random()*.15+.20:mid?Math.random()*.10+.10:.035};--high:${near?Math.random()*.18+.44:mid?Math.random()*.14+.24:.15};--duration:${near?Math.random()*3+2:Math.random()*5+4}s;--delay:-${Math.random()*6}s;--tint:${near?'#b9a3ff':mid?'#69e9d8':'#7680bd'}`;stars.appendChild(s)}
let lastFrame=performance.now(),autoSpin=true;
function render(now=performance.now()){const dt=Math.min(40,now-lastFrame);lastFrame=now;if(autoSpin&&!dragging)yaw+=dt*.000075; yaw+=velocityX;pitch+=velocityY;velocityX*=.94;velocityY*=.94;pitch=Math.max(-1.15,Math.min(1.15,pitch));layoutGalaxy();if(autoSpin||Math.abs(velocityX)+Math.abs(velocityY)>.01)raf=requestAnimationFrame(render)}
function select(p){planets.forEach(x=>x.classList.remove('selected'));p.classList.add('selected');const color=getComputedStyle(p).getPropertyValue('--color'),cover=getComputedStyle(p).getPropertyValue('--cover');if(p.dataset.kind==='album'){document.querySelector('#albumTitle').textContent=p.dataset.title;document.querySelector('#albumArtist').textContent=p.dataset.artist+' · 2011';document.querySelector('#albumMeta').textContent='22 首 · '+p.dataset.time;document.querySelector('#albumCover').style.setProperty('--cover',cover||`linear-gradient(135deg,${color},#16182e)`);document.querySelector('#albumPanel').classList.add('show');info.classList.remove('show')}else{document.querySelector('#title').textContent=p.dataset.title;document.querySelector('#artist').textContent=p.dataset.artist;document.querySelector('#time').textContent=p.dataset.time;document.querySelector('#cover').textContent=p.dataset.icon;document.querySelector('#cover').style.setProperty('--color',color);if(cover)document.querySelector('#cover').style.backgroundImage=cover;info.classList.add('show');document.querySelector('#albumPanel').classList.remove('show')}}
let velocityX=0,velocityY=0,lastY=0;
planets.forEach(p=>p.onclick=e=>{e.stopPropagation();if(!dragging)select(p)});sky.onpointerdown=e=>{dragging=true;autoSpin=false;lastX=e.clientX;lastY=e.clientY;velocityX=0;velocityY=0;sky.setPointerCapture(e.pointerId);sky.classList.add('dragging')};sky.onpointermove=e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;velocityX=dx*.006;velocityY=dy*.006;yaw+=velocityX;pitch=Math.max(-1.15,Math.min(1.15,pitch+velocityY));layoutGalaxy()};sky.onpointerup=()=>{dragging=false;sky.classList.remove('dragging');cancelAnimationFrame(raf);lastFrame=performance.now();raf=requestAnimationFrame(()=>{autoSpin=true;render()})};sky.onpointercancel=sky.onpointerup;sky.onclick=()=>info.classList.remove('show');
layoutGalaxy();window.addEventListener('resize',layoutGalaxy);raf=requestAnimationFrame(render);
document.querySelector('#closeAlbum').onclick=()=>document.querySelector('#albumPanel').classList.remove('show');document.querySelector('#playAlbum').onclick=e=>{e.currentTarget.textContent='Ⅱ 正在播放';setTimeout(()=>e.currentTarget.textContent='▶ 播放专辑',1800)};
document.querySelectorAll('.mode-orbit button').forEach(b=>b.onclick=e=>{e.stopPropagation();document.querySelectorAll('.mode-orbit button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const mode=b.dataset.mode;planets.forEach(p=>p.style.display=mode==='all'||p.dataset.kind===mode||mode==='hot'&&p.classList.contains('cover-gold')?'block':'none')});document.querySelector('#play').onclick=()=>{document.querySelector('#play').textContent='Ⅱ';setTimeout(()=>document.querySelector('#play').textContent='▶',1800)};
</script></body></html>
