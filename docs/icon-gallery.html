<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XSTAR · Icon Lab</title>
<style>
  :root{
    --page:#07080c;
    --card:#0d1017;
    --line:#1a2030;
    --ink:#e8eefc;
    --muted:#6b7a91;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--page);color:var(--ink);font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif}
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(700px 420px at 12% -8%,rgba(70,110,220,.14),transparent 70%),
      radial-gradient(600px 400px at 92% 4%,rgba(180,70,220,.10),transparent 70%);
  }
  .page{position:relative;max-width:1460px;margin:0 auto;padding:38px 40px 30px}
  header{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
  .brandline{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:3px;color:#8fb4ff;font-weight:600}
  .brandline .dot{width:7px;height:7px;border-radius:50%;background:#78a9ff;box-shadow:0 0 12px #78a9ff}
  h1{font-size:26px;line-height:1.25;margin:2px 0 0;font-weight:650;letter-spacing:.5px}
  header p{margin:0;font-size:12.5px;color:var(--muted);letter-spacing:.3px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
  .card{
    position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:18px 16px 16px;display:flex;flex-direction:column;align-items:center;
    box-shadow:0 18px 40px -28px rgba(0,0,0,.9);
  }
  .num{position:absolute;top:13px;left:15px;font-size:10px;color:#4d5c73;letter-spacing:2px;font-weight:700}
  .tag{position:absolute;top:11px;right:13px;font-size:9px;color:#7d8ba0;border:1px solid #212b3d;border-radius:20px;padding:3px 8px;letter-spacing:1px}
  .icon{
    width:210px;height:210px;border-radius:26%;overflow:hidden;cursor:zoom-in;
    box-shadow:0 16px 26px -16px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.045);
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .icon:hover{transform:translateY(-3px) scale(1.012);box-shadow:0 24px 40px -18px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.09)}
  .icon svg{display:block;width:100%;height:100%}
  .smallrow{display:flex;align-items:center;gap:16px;height:46px;margin-top:13px}
  .icon.small{width:48px;height:48px;border-radius:26%;cursor:zoom-in;box-shadow:0 6px 12px -6px rgba(0,0,0,.8)}
  .icon.tiny{width:32px;height:32px;border-radius:26%;cursor:zoom-in;box-shadow:none}
  .name{margin-top:11px;font-size:13.5px;font-weight:600;color:#dfe8f8;letter-spacing:.4px}
  .en{margin-top:3px;font-size:9.5px;letter-spacing:2.2px;color:#5b6a80;text-transform:uppercase}
  footer{margin-top:26px;padding-top:18px;border-top:1px solid #141a26;display:flex;justify-content:space-between;gap:20px;font-size:10.5px;color:#425064;letter-spacing:1px}
  .lightbox{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(3,5,10,.9);backdrop-filter:blur(10px);cursor:zoom-out}
  .lightbox.open{display:flex}
  .lightbox svg{width:min(64vmin,480px);height:min(64vmin,480px);border-radius:26%;box-shadow:0 30px 80px rgba(0,0,0,.7)}
  @media (max-width:1180px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:880px){.grid{grid-template-columns:repeat(2,1fr)}.icon{width:180px;height:180px}}
</style>
</head>

</svg>

<script>
  const items = [
    ["01","i01","线描","LINE","极简"],
    ["02","i02","粗体","BOLD","瑞士"],
    ["03","i03","包豪斯","BAUHAUS","几何"],
    ["04","i04","纸雕","PAPER","手作"],
    ["05","i05","磁带","CASSETTE","复古"],
    ["06","i06","复古黑胶","RETRO","复古"],
    ["07","i07","像素","PIXEL","游戏"],
    ["08","i08","水墨","INK","东方"],
    ["09","i09","玻璃","GLASS","拟态"],
    ["10","i10","流体","FLUID","渐变"],
    ["11","i11","霓虹","NEON","夜行"],
    ["12","i12","黏土","CLAY","3D"],
    ["13","i13","星轨","ORBIT","太空"],
    ["14","i14","午夜黑胶","MIDNIGHT","品牌"],
    ["15","i15","播放","PLAY","直观"],
    ["16","i16","黑金","GOLD","质感"]
  ];
  const grid = document.getElementById('grid');
  grid.innerHTML = items.map(([num,id,cn,en,tag]) => `
    <section class="card">
      <span class="num">${num}</span>
      <span class="tag">${tag}</span>
      <div class="icon"><svg viewBox="0 0 108 108"><use href="#${id}"/></svg></div>
      <div class="smallrow">
        <div class="icon small"><svg viewBox="0 0 108 108"><use href="#${id}"/></svg></div>
        <div class="icon tiny"><svg viewBox="0 0 108 108"><use href="#${id}"/></svg></div>
      </div>
      <div class="name">${cn}</div>
      <div class="en">${en}</div>
    </section>
  `).join('');

  const lightbox = document.getElementById('lightbox');
  document.addEventListener('click', (e) => {
    const icon = e.target.closest('.icon');
    if (icon) {
      const svg = icon.querySelector('svg').cloneNode(true);
      lightbox.innerHTML = '';
      lightbox.appendChild(svg);
      lightbox.classList.add('open');
      return;
    }
    if (e.target.closest('#lightbox')) lightbox.classList.remove('open');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') lightbox.classList.remove('open'); });
</script>
</body>
</html>
