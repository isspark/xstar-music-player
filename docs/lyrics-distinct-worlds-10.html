const designs=[

{name:'纵卷诗笺',en:'TRAVELLING INK',tag:'竖排 / 游卷',concept:'暖纸、远山、朱印。用真正的竖排和从右至左的阅读顺序表达慢歌。',layout:'三列不同字号的竖排诗句，高低错落；主句右侧，上一句与下一句退到左方。',effect:'演唱中的字染成朱红，文字稳定，山影与纸卷缓慢横移。',transition:'整卷横向游移，新的一列从右侧进入，旧列退向左侧，像展开手卷。',cls:'scroll'},
{name:'漫画爆格',en:'COMIC CUT',tag:'分镜 / 破框',concept:'黄、蓝、红三块漫画分镜，每个词组都拥有自己的对白框与戏剧节拍。',layout:'上方两个小格，下方一个横跨的大格；竖屏改成三个上下分镜。',effect:'对白框依次撞入、回弹，唱到的分镜轻震，速度线强调情绪。',transition:'三格按不同方向甩走，下一组对白以斜向裁切破框进入。',cls:'comic'},
{name:'环形唱针',en:'NEEDLE & GROOVE',tag:'环排 / 跳针',concept:'歌词刻在黑胶唱片的圆周上，听歌变成一场围绕唱针的阅读。',layout:'单字沿圆环分布，右下独立显示两行可读歌词；圆形与留白构成主体。',effect:'唱片低速转动，字沿环逐一变暖金，唱针轻轻摆动。',transition:'唱针抬起，唱片快速转半圈并换上新歌词，唱针重新落下。',cls:'vinyl'},
{name:'终端心跳',en:'HEARTBEAT TERMINAL',tag:'日志 / 换行',concept:'一首歌是一段持续写入的私人日志。等宽字、命令提示符与绿色余辉。',layout:'左对齐的多行信息瀑布；前后歌词作为历史日志，当前句嵌在命令行中。',effect:'歌词逐字输入，光标跟进，唱过的字保持绿色荧光，未出现的字不占视觉焦点。',transition:'整行提交到历史区，日志向上滚动，新提示符在下方开始输入。',cls:'terminal'},
{name:'折页情书',en:'LETTERS IN A BOOK',tag:'书页 / 翻页',concept:'歌词是一封装订在书里的信，暖纸、衬线字与书脊阴影带来安静的实体感。',layout:'双页展开，左页是上一句的记忆，右页是当前句；竖屏改成单页。',effect:'逐词变成赭红，并留下细下划线，阅读像慢慢划过一段喜欢的文字。',transition:'右页绕书脊向左翻转，露出下一页；纸面在侧立时收窄成一条线。',cls:'book'},
{name:'午夜站牌',en:'LAST TRAIN DISPLAY',tag:'四格 / 翻牌',concept:'把歌词变成深夜车站的机械翻牌屏，每一小段都是下一班心事。',layout:'四个独立方格展示当前半句，其他词藏在下一组翻牌里；站点与班次辅助叙事。',effect:'每格从中轴翻转，演唱中的字亮起暖黄，翻牌存在错峰节奏。',transition:'先后半句翻牌替换，再整组翻到下一句，始终保留真实的机械格位。',cls:'station'},
{name:'星图航线',en:'CONSTELLATION ROUTE',tag:'散点 / 穿梭',concept:'歌词拆成四个漂浮坐标，阅读路径由连接线引导，像穿梭在一张私人星图里。',layout:'四组词分居左上、右上、左下与右下，字号与深度各异，拒绝中央基线。',effect:'当前坐标向前浮起，星图连线逐段点亮，不同词组保持轻微视差。',transition:'镜头沿斜线加速掠过星图，整组坐标穿过视野，下一张图从远处接近。',cls:'cosmos'},
{name:'录像厅慢歌',en:'VHS KARAOKE',tag:'双行 / 横扫',concept:'紫色落日、模拟录像和双行字幕，保留老式卡拉 OK 特有的朴素情绪。',layout:'景物占上半画面，歌词稳定落在底部：主句大字，下一句小字。',effect:'四拍倒计时后逐字染黄，录像扫描纹与轻微横向扰动制造年代感。',transition:'字幕在水平遮罩中卷走，下一行升格为主句；背景保留，只有字幕系统切换。',cls:'karaoke'},
{name:'手账散片',en:'CUT & PASTE DIARY',tag:'拼贴 / 抛卡',concept:'蓝底、粉纸、荧光便签与胶带。每组歌词都是贴上去的一张有性格的小纸片。',layout:'四张不同大小、不同字体的纸片交叠成 Z 形，保留斜角、错位和手工痕迹。',effect:'唱到的纸片向上抬起，字变橙红，纸片依次落地而非整句统一出现。',transition:'纸片按各自角度旋转抛出，下一组从不同边缘落入，像重新整理一页手账。',cls:'collage'}
];
const verses=[['让风','带走','所有','遗憾'],['把光','留给','今晚','的你'],['我们','终会','再次','相遇'],['沿着','回声','找到','自己']];
const $=id=>document.getElementById(id),stage=$('stage'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
let selected=0,line=0,phase=reduced.matches?3200:0,last=0,clock=0,playing=!reduced.matches,speed=1,px=0,py=0,tx=0,ty=0;const duration=8500,clamp=(n,a=0,b=1)=>Math.min(b,Math.max(a,n)),ease=n=>1-Math.pow(1-clamp(n),3);
function words(text){return [...text].map(c=>`<span class="word">${c}</span>`).join('')}
function content(i,index){const v=verses[index],prev=verses[(index+3)%4],next=verses[(index+1)%4],full=v.join('');switch(i){
case 0:return `<div class="outline">${v[3]}</div><div class="issue">XSTAR / SOUND AS A POSTER</div><div class="stamp">VOL. ${index+1} — 2026</div><div class="rule"></div><div class="hero">${words(v[0])}<br>${words(v[1])}</div><div class="sub">${words(v[2])}<br>${words(v[3])}</div><div class="bar"></div><div class="small">DON'T READ IT. FEEL IT. / ${index+1}</div>`;
case 1:return `<div class="moon"></div><div class="mountain"></div><div class="columns"><div class="column">${words(v.slice(0,2).join(''))}</div><div class="column">${words(v.slice(2).join(''))}</div><div class="column">${prev.join('')}</div></div><div class="seal">声入心</div><div class="caption">第${index+1}章 · 风有来信</div>`;
case 2:return `<div class="panels">${[v[0],v[1],v[2]+v[3]].map((text,j)=>`<div class="panel"><div class="speedlines"></div><span class="tag">FRAME ${j+1}</span><div class="bubble">${words(text)}</div></div>`).join('')}</div>`;
case 3:return `<div class="label">SIDE A / A SONG FOR YOU</div><div class="disc"><div class="ring">${[...full].map((c,j)=>`<span class="word" style="transform:rotate(${j*360/8-110}deg) translateY(-22cqw) rotate(90deg)">${c}</span>`).join('')}</div><div class="center">XSTAR RECORDS<br>33⅓ RPM<br>TRACK 0${index+1}</div></div><div class="arm"></div><div class="now">${v.slice(0,2).join('')}<br>${v.slice(2).join('')}</div><div class="catalog">ANALOG HEART / STEREO / ${index+1}</div>`;
case 4:return `<div class="term-head"><span>USER@HEART : ~/memories</span><span>LIVE SESSION ●</span></div><div class="logs"><div class="dim">[SYSTEM] connection established<br>[ARCHIVE] ${prev.join('')}<br>[AUDIO] decoding emotional signal...</div><div class="current-log">&gt; ${words(full)}<span class="cursor"></span></div><div class="meta">STREAM 0${index+1} / UTF-8 / HEARTBEAT STABLE<br>next_packet: ${next.join('')}</div></div>`;
case 5:return `<div class="desk"></div><div class="bookmark"></div><div class="spread"><div class="page left"><h4>那些已经读过的话</h4><div class="verse">${prev[0]}${prev[1]}，<br>${prev[2]}${prev[3]}。<br><br>写给远方的你。</div><div class="page-number">${index*2+1}</div></div><div class="page right"><h4>一封没有寄出的信 / ${index+1}</h4><div class="verse">${words(v[0]+v[1])}，<br>${words(v[2]+v[3])}。</div><div class="page-number">${index*2+2}</div></div></div>`;
case 6:return `<div class="station-label">心事中央站 / LAST TRAIN</div><div class="board"><div class="board-head"><span>DEPARTURE / 发往明天</span><span>00:0${index+1}</span></div><div class="tiles">${[...full.slice(0,4)].map(c=>`<div class="tile">${c}</div>`).join('')}</div></div><div class="ticker">PLATFORM 02 / PLEASE FOLLOW YOUR HEART</div><div class="info-line"><span>上一站 · ${prev[0]+prev[1]}</span><span>下一站 · ${next[0]+next[1]} →</span></div>`;
case 7:return `<div class="stars"></div><div class="nebula"></div><svg viewBox="0 0 1000 625" preserveAspectRatio="none"><polyline points="170,190 620,130 340,410 780,355" fill="none" stroke="#899dd95a" stroke-width="1" stroke-dasharray="3 7"/></svg><div class="nodes">${v.map((w,j)=>`<div class="node" style="left:${[17,62,34,76][j]}%;top:${[29,20,64,56][j]}%;font-size:${[5,3.5,6,4.2][j]}cqw"><small>COORDINATE 0${j+1}</small>${words(w)}</div>`).join('')}</div><div class="coordinates">XSTAR DEEP FIELD / ${index+1}<br>FOLLOW THE WORDS, NOT THE STARS.</div>`;
case 8:return `<div class="sunset"><div class="sun"></div><div class="hills"></div></div><div class="tv"></div><div class="vhs">▶ PLAY / SP</div><div class="song-name">心动录像带 · 0${index+1}</div><div class="sing-lines"><div class="dots">● ● ● ●</div><div class="main-verse">${words(full)}</div><div class="second">${next.join('')}</div></div>`;
case 9:return `<div class="texture"></div><div class="scribble"></div><div class="papers">${v.map((w,j)=>`<div class="paper" style="left:${[10,49,17,53][j]}%;top:${[20,33,50,67][j]}%">${words(w)}</div>`).join('')}</div><div class="asterisk">✳</div><div class="cutout">COLLECTING LITTLE MOMENTS / PAGE 0${index+1}</div>`;
}}
designs.forEach((d,i)=>{const btn=document.createElement('button');btn.className='tab';btn.innerHTML=`<small>${String(i+1).padStart(2,'0')}</small><b>${d.name}</b><span>${d.tag}</span>`;btn.onclick=()=>select(i);$('tabs').append(btn)});
function select(i){selected=(i+10)%10;phase=reduced.matches?duration*.45:0;const d=designs[selected];$('code').textContent=String(selected+1).padStart(2,'0')+' / '+d.en;for(const k of ['name','concept','layout','effect'])$(k).textContent=d[k];$('transitionText').textContent=d.transition;[...$('tabs').children].forEach((el,j)=>el.setAttribute('aria-pressed',String(j===selected)));history.replaceState(null,'','#'+(selected+1));build();draw()}
function build(){stage.replaceChildren();for(let j=0;j<2;j++){const el=document.createElement('div');el.className='scene active '+designs[selected].cls;el.dataset.layer=j;el.setAttribute('aria-hidden',String(j===1));el.innerHTML=content(selected,(line+j)%4);stage.append(el)}stage.setAttribute('aria-label',designs[selected].name+'歌词设计预览');layoutStage()}
function layoutStage(){stage.classList.toggle('tall',stage.clientHeight>stage.clientWidth*1.2);if(selected===3){const tall=stage.classList.contains('tall');stage.querySelectorAll('.ring span').forEach((el,j)=>{const i=j%8;el.style.transform=`rotate(${i*45-110}deg) translateY(-${tall?31:22}cqw) rotate(90deg)`})}}
new ResizeObserver(()=>{layoutStage();draw()}).observe(stage);
function transform(el,s){if(el)el.style.transform=s}
function draw(){const p=phase/duration,entry=ease(p/.16),out=clamp((p-.78)/.22),e=ease(out),song=clamp((p-.16)/.62)*8,still=reduced.matches;const layers=stage.querySelectorAll('.scene');const A=layers[0],B=layers[1];if(!A||!B)return;for(const el of layers){el.style.transform='none';el.style.opacity='1';el.style.clipPath='none';el.style.filter='none';el.style.zIndex=el===A?'2':'1';el.style.visibility='visible'}
// The upcoming scene is physically present during transition, not a reset after fade-out.
const en=still?1:entry,ex=still?0:e;const visualTime=still?0:clock;
layers.forEach((layer,k)=>{const sing=k===0?song:0;layer.querySelectorAll('.word').forEach((el,i)=>el.classList.toggle('on',sing>i));});
if(selected===0){transform(A.querySelector('.hero'),`translateY(${(1-en)*25}%)`);transform(A,`scale(${1+ex*7}) rotate(${ex*-7}deg)`);A.style.opacity=String(ex>.72?1-(ex-.72)/.28:1);transform(B,`scale(${.83+ex*.17})`);A.querySelector('.bar').style.width=(8+song*3)+'%'}
if(selected===1){const offset=stage.clientWidth;transform(A,`translateX(${-ex*offset}px)`);transform(B,`translateX(${(1-ex)*offset}px)`);A.querySelectorAll('.column').forEach((el,i)=>transform(el,`translateY(${(1-en)*(i+1)*18}px)`));transform(A.querySelector('.mountain'),`rotate(-12deg) translateX(${-visualTime*1.5}px)`)}
if(selected===2){B.style.clipPath=`polygon(0 0,${ex*150}% 0,${ex*150-50}% 100%,0 100%)`;B.style.zIndex='3';A.querySelectorAll('.panel').forEach((el,i)=>{const local=ease((p-i*.05)/.13);transform(el,`translate(${ex*(i%2?110:-110)}%,${ex*(i===2?120:-70)}%) rotate(${(i%2?2:-1)+ex*(i-1)*30}deg)`);const bubble=el.querySelector('.bubble');const active=Math.floor(song/2)===i;transform(bubble,`scale(${(.65+local*.35)+(active&&!still?Math.sin(visualTime*18)*.015:0)}) rotate(${i===2?3:-6}deg)`)})}
if(selected===3){B.style.opacity=String(ex);A.style.opacity=String(1-ex);for(const [k,layer] of [...layers].entries()){transform(layer.querySelector('.disc'),`rotate(${visualTime*3+ex*180+k*30}deg)`);transform(layer.querySelector('.arm'),`rotate(${-50-Math.sin(out*Math.PI)*17}deg)`)}transform(A.querySelector('.now'),`translateY(${(1-en)*25}px)`)}
if(selected===4){B.style.visibility=out>0?'visible':'hidden';transform(A.querySelector('.logs'),`translateY(${-ex*70}%)`);A.style.opacity=String(1-ex);transform(B.querySelector('.logs'),`translateY(${(1-ex)*65}%)`);A.querySelectorAll('.current-log .word').forEach((el,i)=>{el.style.display=song>i?'inline-block':'none'});A.querySelector('.cursor').style.opacity=still?'1':String(Math.sin(visualTime*8)>0?1:.1)}
if(selected===5){const page=A.querySelector('.right');transform(page,`rotateY(${-ex*178}deg)`);page.style.filter=`brightness(${1-Math.sin(ex*Math.PI)*.4})`;A.style.background='transparent';A.querySelector('.desk').style.visibility='hidden';A.querySelector('.left').style.opacity=String(1-clamp((ex-.7)/.3));transform(A.querySelector('.spread'),`rotateX(${(1-en)*15}deg)`)}
if(selected===6){B.style.visibility='hidden';const group=song<4?0:1;const v=verses[line];const upcoming=verses[(line+1)%4];A.querySelectorAll('.tile').forEach((tile,i)=>{let flip=clamp((song-3.65-i*.08)/.55);if(out>0)flip=clamp((out-i*.12)/.5);const flipping=out>0?flip:group||flip>0?flip:0;tile.textContent=out>0?(flip>.5?upcoming.join('')[i]:v.join('')[i+4]):(flip>.5?v.join('')[i+4]:v.join('')[i]);tile.classList.toggle('on',out===0&&Math.floor(song)%4===i);transform(tile,`rotateX(${Math.sin(flipping*Math.PI)*-88+(1-en)*-85}deg)`);tile.style.filter=`brightness(${1-Math.sin(flipping*Math.PI)*.5})`})}
if(selected===7){transform(A,`translate3d(${-ex*stage.clientWidth*.85}px,${ex*stage.clientHeight*.4}px,${ex*650}px) rotateZ(${ex*15}deg)`);A.style.opacity=String(1-ex);transform(B,`translate3d(${(1-ex)*stage.clientWidth*.45}px,${-(1-ex)*stage.clientHeight*.3}px,${-(1-ex)*600}px)`);A.querySelectorAll('.node').forEach((el,i)=>{const active=Math.floor(song/2)===i;transform(el,`translate(${px*(i+1)*3}px,${py*(i+1)*2}px) translateZ(${active?55:0}px) scale(${active?1.12:1})`);el.style.opacity=String(.5+(active?.5:.05))});A.querySelector('polyline').style.strokeDashoffset=String(-visualTime*6)}
if(selected===8){B.style.visibility='hidden';const main=A.querySelector('.main-verse'),second=A.querySelector('.second');main.style.clipPath=`inset(0 ${ex*100}% 0 0)`;transform(main,`translateY(${-ex*15}px)`);transform(second,`translateY(${-ex*55}%) scale(${1+ex*.42})`);second.style.opacity=String(.6+ex*.4);A.querySelector('.dots').style.opacity=String(1-clamp(p/.18));transform(A.querySelector('.sunset'),`translateX(${still?0:Math.sin(visualTime*14)*.35}px)`)}
if(selected===9){B.style.visibility=out>0?'visible':'hidden';B.style.background='transparent';B.querySelector('.texture').style.visibility='hidden';A.querySelectorAll('.paper').forEach((el,i)=>{const drop=ease((p-i*.04)/.15),active=Math.floor(song/2)===i,angle=[-8,7,-4,11][i];transform(el,`translate(${ex*(i%2?180:-190)}%,${(1-drop)*-300+ex*(i<2?-220:250)-(active?5:0)}%) rotate(${angle+ex*(i%2?80:-95)}deg)`);el.style.opacity=String(1-ex*.8)});B.querySelectorAll('.paper').forEach((el,i)=>transform(el,`translateY(${(1-ease((out-i*.1)/.7))*-450}%) rotate(${[-8,7,-4,11][i]}deg)`))}
if(out===0)B.style.visibility='hidden';$('scrub').value=String(p*1000);$('percent').textContent=String(Math.round(p*100)).padStart(2,'0')+'%';[...$('phases').children].forEach((el,i)=>el.classList.toggle('active',i===(p<.16?0:p<.78?1:2)))}
function nextLine(){line=(line+1)%4;phase=reduced.matches?duration*.45:0;build();draw()}
function updatePlay(){$('play').textContent=playing?'Ⅱ 暂停':'▶ 播放';$('play').setAttribute('aria-label',playing?'暂停预览':'播放预览')}
function clean(on){document.body.classList.toggle('clean',on);requestAnimationFrame(()=>{layoutStage();draw()})}
$('prev').onclick=()=>select(selected-1);$('next').onclick=()=>select(selected+1);$('play').onclick=()=>{playing=!playing;updatePlay()};$('nextLine').onclick=()=>{if(reduced.matches){nextLine();return}phase=duration*.78;playing=true;updatePlay()};$('transition').onclick=()=>{phase=duration*.77;playing=true;speed=.5;$('slow').textContent='1× 正常';$('slow').setAttribute('aria-pressed','true');updatePlay()};$('slow').onclick=()=>{speed=speed===1?.5:1;$('slow').textContent=speed===1?'0.5× 慢放':'1× 正常';$('slow').setAttribute('aria-pressed',String(speed===.5))};$('portrait').onclick=()=>{const on=document.body.classList.toggle('portrait');$('portrait').setAttribute('aria-pressed',String(on));$('portrait').textContent=on?'横屏':'竖屏'};$('scrub').oninput=e=>{playing=false;phase=+e.target.value/1000*duration;updatePlay();draw()};$('clean').onclick=()=>clean(true);$('exit').onclick=()=>clean(false);stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*2-1;ty=(e.clientY-r.top)/r.height*2-1});stage.addEventListener('pointerleave',()=>{tx=ty=0});document.addEventListener('keydown',e=>{if(e.key==='Escape')clean(false);if(e.target.closest('button,input')||e.ctrlKey||e.metaKey||e.altKey)return;if(e.code==='Space'){e.preventDefault();playing=!playing;updatePlay()}if(e.key==='ArrowRight'){e.preventDefault();select(selected+1)}if(e.key==='ArrowLeft'){e.preventDefault();select(selected-1)}if(e.key.toLowerCase()==='n')$('nextLine').click();if(e.key.toLowerCase()==='t')$('transition').click()});document.addEventListener('visibilitychange',()=>last=0);reduced.addEventListener('change',e=>{if(e.matches){playing=false;phase=duration*.45;updatePlay();draw()}});
function tick(now){const dt=last?Math.min(now-last,70):0;last=now;if(playing&&!document.hidden){phase+=dt*speed;if(!reduced.matches){clock+=dt/1000*speed;px+=(tx-px)*.04;py+=(ty-py)*.04}if(phase>=duration)nextLine();draw()}requestAnimationFrame(tick)}
const initial=Number(location.hash.slice(1));select(Number.isInteger(initial)&&initial>=1&&initial<=10?initial-1:0);updatePlay();requestAnimationFrame(tick);
</script></body></html>
